spring.application.name=E- commerce - platform

# Routes are /{stage}/... Set APP_STAGE per deployment.
app.stage=${APP_STAGE:dev}

# Secrets are not here. Locally they come from the gitignored application-dev.properties
# (copy application-example.properties); bootRun activates the dev profile.

# Flyway: runs db/migration V1..Vn at startup. The seed admin's login is
# passed into V9 as placeholders (spring.flyway.placeholders.seed_admin_*).

springdoc.api-docs.path=/v3/api-docs

# JWT access tokens (HS256).
jwt.issuer=ecommerce-platform
jwt.expiry-minutes=60

# Paystack.
paystack.base-url=https://api.paystack.co

# Email. Without spring.mail.host the app still starts; queued emails then fail with a clear reason.
spring.mail.port=2525
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
notifications.from=no-reply@shoporah.test

# Notification outbox sender: polls every poll-delay-ms, sends up to batch-size rows per run,
# retries a failed row after retry-delay-seconds, and marks it FAILED after max-attempts.
notifications.sender.enabled=true
notifications.poll-delay-ms=5000
notifications.batch-size=20
notifications.max-attempts=5
notifications.retry-delay-seconds=60

# Password reset: links last token-minutes; a new request within cooldown-seconds of the
# last link is ignored. url is the frontend page the emailed link opens (the token is added as ?token=...).
password-reset.token-minutes=30
password-reset.cooldown-seconds=60
password-reset.url=http://localhost:3000/reset-password

# Product images: at most 5 MB per file.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# The account is optional: without it the app starts and image uploads are refused.
cloudinary.base-url=https://api.cloudinary.com

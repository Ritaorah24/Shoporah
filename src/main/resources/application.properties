spring.application.name=E- commerce - platform

# Local secrets: loaded from secrets.local.properties in the project root
# when it exists (git-ignored). In other environments the same names are
# supplied as real environment variables instead.
spring.config.import=optional:file:./secrets.local.properties

# Database (values come from secrets.local.properties or environment variables)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway: runs db/migration V1..Vn at startup. The seed admin's login is
# passed into V9 as placeholders (values from secrets / environment variables).
spring.flyway.placeholders.seed_admin_email=${SEED_ADMIN_EMAIL}
spring.flyway.placeholders.seed_admin_password=${SEED_ADMIN_PASSWORD}

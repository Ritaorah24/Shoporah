spring.application.name=E- commerce - platform

# Local secrets: loaded from secrets.local.properties in the project root
# when it exists (git-ignored). In other environments the same names are
# supplied as real environment variables instead.
spring.config.import=optional:file:./secrets.local.properties

# Database (values come from secrets.local.properties or environment variables)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway: runs db/migration V1..Vn at startup. The seed admin's login is
# passed into V9 as placeholders (values from secrets / environment variables).
spring.flyway.placeholders.seed_admin_email=${SEED_ADMIN_EMAIL}
spring.flyway.placeholders.seed_admin_password=${SEED_ADMIN_PASSWORD}

# JWT access tokens (HS256). The signing key comes from secrets / environment variables.
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=ecommerce-platform
app.jwt.expiry-minutes=60

# Paystack (checkpoint 1.4). The secret key comes from secrets / environment variables.
# callback-url is where Paystack sends the customer's browser after paying; empty means
# Paystack uses the callback URL set on the Paystack dashboard.
app.paystack.secret-key=${PAYSTACK_SECRET_KEY}
app.paystack.base-url=https://api.paystack.co
app.paystack.callback-url=${PAYSTACK_CALLBACK_URL:}

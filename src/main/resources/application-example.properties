# Template for the gitignored src/main/resources/application-dev.properties.
# Copy it, fill in values, never commit the copy. Keys only: no real values here.
#
# Each key is written once per stage as <prefix>.<stage>.<rest>; StageAwarePropertyResolver
# maps the active app.stage to the bare key. Flip app.stage to switch.

app.stage=dev

# Database. Keep "?options=-c%20search_path%3dpublic,public&stringtype=unspecified" at the end of the URL.
datasource.dev.url=jdbc:postgresql://localhost:5432/<database>?options=-c%20search_path%3dpublic,public&stringtype=unspecified
datasource.prod.url=
datasource.dev.username=
datasource.prod.username=
datasource.dev.password=
datasource.prod.password=

# First super admin, created once by Flyway migration V9 (temporary password,
# must be changed on first login). No single quote (') allowed in these values.
spring.flyway.dev.placeholders.seed_admin_email=
spring.flyway.prod.placeholders.seed_admin_email=
spring.flyway.dev.placeholders.seed_admin_password=
spring.flyway.prod.placeholders.seed_admin_password=

# JWT signing key: random, at least 32 bytes, base64-encoded. Anyone with it can forge tokens.
# Generate one with (Git Bash): head -c 32 /dev/urandom | base64
jwt.dev.secret=
jwt.prod.secret=

# Paystack secret key (Paystack dashboard -> Settings -> API Keys & Webhooks). Use the TEST key
# (sk_test_...) outside production. Required: the app refuses to start without it.
paystack.dev.secret-key=
paystack.prod.secret-key=
# Optional: where Paystack sends the customer after paying (e.g. the frontend's payment-result page).
# Leave blank to use the callback URL set in the Paystack dashboard.
paystack.dev.callback-url=
paystack.prod.callback-url=

# Optional: SMTP server for emails. In development use Mailtrap's Email Sandbox
# (mailtrap.io -> Email Testing -> Sandboxes -> SMTP settings): it catches every email, nothing reaches
# real inboxes. Leave the host blank to run without email (emails are queued, then marked FAILED).
spring.mail.dev.host=
spring.mail.prod.host=
spring.mail.dev.username=
spring.mail.prod.username=
spring.mail.dev.password=
spring.mail.prod.password=
# Sender address shown on emails (any address works with the Mailtrap sandbox).
notifications.dev.from=no-reply@shoporah.test
notifications.prod.from=

# Optional: the frontend page that password reset emails link to (the token is added as ?token=...).
# Must not be blank; delete the line to use the default http://localhost:3000/reset-password.
#password-reset.dev.url=
#password-reset.prod.url=

# Optional: Cloudinary account for product images. Free account at cloudinary.com, then
# Dashboard -> API Keys: Cloud name, API Key, API Secret. Leave blank to run without image uploads.
cloudinary.dev.cloud-name=
cloudinary.prod.cloud-name=
cloudinary.dev.api-key=
cloudinary.prod.api-key=
cloudinary.dev.api-secret=
cloudinary.prod.api-secret=

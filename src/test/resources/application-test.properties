# Test profile: active only for the tests in src/test (via @ActiveProfiles("test")).
# The dev profile is not active here, so application-dev.properties and its database are never read.
# Values come from secrets.local.properties in the project root (git-ignored) or environment variables.
spring.config.import=optional:file:./secrets.local.properties

# The tests call /dev/... routes.
app.stage=dev

# Must point to a database whose name ends in _test: TestDatabaseReset refuses anything else.
datasource.url=${TEST_DB_URL}
datasource.username=${DB_USERNAME}
datasource.password=${DB_PASSWORD}

spring.flyway.placeholders.seed_admin_email=${SEED_ADMIN_EMAIL}
spring.flyway.placeholders.seed_admin_password=${SEED_ADMIN_PASSWORD}

jwt.secret=${JWT_SECRET}
paystack.secret-key=${PAYSTACK_SECRET_KEY}

# Lets TestDatabaseReset wipe the test database before the tests run. Never set this in main.
spring.flyway.clean-disabled=false

# No background sender in tests: they call NotificationSender.sendDue themselves (and FakeEmailChannel sends nothing).
notifications.sender.enabled=false
